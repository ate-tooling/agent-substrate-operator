# Local development on a kind cluster made with upstream's
# hack/create-kind-cluster.sh. The images come from ghcr.io/ate-tooling/substrate;
# to use your own build, push it to the kind registry and point images there:
#   hack/publish-substrate-images.sh <upstream checkout> localhost:5001/substrate linux/arm64
apiVersion: substrate.ate-tooling.github.io/v1alpha1
kind: SubstrateInstall
metadata:
  name: substrate
spec:
  platform: kind
  atenet:
    credentialProvider:
      name: k8s.io
    # kubectl ate proxy dials the router as this service account.
    ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/ate-system/sa/atenet-client
  deletionPolicy: Delete
