# ActorTemplate for the hello actor: busybox httpd serving one page on port 80.
# It is not a CRD; create it with kubectl ate create actor-template -f.
# The API requires images pinned by digest.
metadata:
  atespace: smoke
  name: hello
workerSelector:
  matchLabels:
    workload: hello
containers:
- name: hello
  image: docker.io/library/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  command: ["sh", "-c", "echo hello from substrate > /index.html && exec httpd -f -p 80 -h /"]
  wakeupProbe:
    httpGet:
      path: /
      port: 80
# An actor occupies its whole worker, so keep this within the pool's limits.
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 268435456 # 256Mi
