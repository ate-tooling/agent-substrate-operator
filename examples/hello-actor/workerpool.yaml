# A single worker for the hello actor, using the worker image of the release
# the operator installs. Applied with kubectl.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: hello
  namespace: smoke
  labels:
    workload: hello
spec:
  replicas: 1
  workerImage: ghcr.io/ate-tooling/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
